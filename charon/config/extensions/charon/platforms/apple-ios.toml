os = "iOS"
sdk = "iphoneos"
deployment-environment = "IPHONEOS_DEPLOYMENT_TARGET"
tool-requires = ["iphoneos-sdk/16.4@charon/stable"]
port-tool-requires = ["dyld-imports-check/1.0@charon/stable", "ldid/2.1.5-procursus7+23.gaf86971@charon/stable"]
python-requires = ["charon-apple/1.0@charon/stable"]
requires = ["apple-compat/1.0@charon/stable"]
extends = ["charon-apple.ApplePort"]
cross-toolchain = "apple-ios.cross-toolchain.cmake"
sysroot-conf = "tools.apple:sdk_path"
build-only = ["Headers", "PrivateHeaders", "Modules", "_CodeSignature"]

[compiler]
libcxx = "libc++"

[conf]
"tools.cmake.cmaketoolchain:generator" = "Ninja"

[architectures.armv7]
os-version = { min = "6.0" }
tool-requires = ["ld64/956.6@charon/stable"]

[architectures.armv8]
os-version = { min = "7.0" }

[frameworks.IOSurface]
public-since = "11.0"

[distributions.jailbreak]
applications = "/Applications"

[distributions.trollstore]

[distributions.sideload]
