<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL frame rate</title>
<style>body { margin: 0; font: 14px -apple-system, sans-serif; } canvas { display: block; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="out">measuring</div>
<script>
function report(text) {
    document.getElementById("out").textContent = text;
    new Image().src = "/report?" + encodeURIComponent(text) + "&r=" + Math.random();
}

var canvas = document.getElementById("canvas");
var gl = canvas.getContext("webgl", { antialias: false });
if (!gl) {
    report("no context");
} else {
    var vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, "attribute vec2 p; uniform float t;" +
        "void main(){ float s = sin(t), c = cos(t);" +
        "gl_Position = vec4(p.x * c - p.y * s, p.x * s + p.y * c, 0.0, 1.0); }");
    gl.compileShader(vertexShader);
    var fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, "precision mediump float; void main(){ gl_FragColor = vec4(0.1, 0.6, 0.9, 1.0); }");
    gl.compileShader(fragmentShader);
    var program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8, -0.8, 0.8, -0.8, 0.0, 0.8]), gl.STATIC_DRAW);
    var position = gl.getAttribLocation(program, "p");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    var time = gl.getUniformLocation(program, "t");

    var sizes = [[64, 64], [320, 240], [320, 480]], results = [], index = 0;

    function measure() {
        if (index >= sizes.length) {
            report(results.join("  "));
            return;
        }
        var width = sizes[index][0], height = sizes[index][1];
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        gl.viewport(0, 0, width, height);

        var frames = 0, start = Date.now();
        function frame() {
            gl.clearColor(0.05, 0.05, 0.08, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform1f(time, frames * 0.05);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            frames++;
            var elapsed = Date.now() - start;
            if (elapsed < 4000) {
                requestAnimationFrame(frame);
                return;
            }
            results.push(width + "x" + height + "=" + Math.round(frames * 1000 / elapsed) + "fps");
            report(results.join("  "));
            index++;
            setTimeout(measure, 300);
        }
        requestAnimationFrame(frame);
    }
    measure();
}
</script>
</body>
</html>
