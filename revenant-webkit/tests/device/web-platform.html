<!doctype html><meta charset=utf-8><title>web-platform</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<body style="font:13px sans-serif;padding:6px">
<script src="report.js"></script>
<script>
function present(name, get) {
    var value;
    try { value = get(); } catch (e) { report(name, false, 'threw ' + e.name); return; }
    report(name, !!value, value ? '' : 'missing');
}

present('wasm-object', function () { return window.WebAssembly; });
present('workers', function () { return window.Worker; });
report('crypto-subtle', !window.isSecureContext || !!(window.crypto && crypto.subtle),
    window.isSecureContext ? '' : 'not a secure context, so not exposed');
present('crypto-random-values', function () { return window.crypto && crypto.getRandomValues; });
report('clipboard-api', !window.isSecureContext || !!(navigator.clipboard && navigator.clipboard.writeText),
    window.isSecureContext ? '' : 'not a secure context, so not exposed');
report('web-share', !window.isSecureContext || typeof navigator.share === 'function',
    window.isSecureContext ? '' : 'not a secure context, so not exposed');
present('text-encoder', function () { return window.TextEncoder; });
present('abort-controller', function () { return window.AbortController; });
present('structured-clone', function () { return window.structuredClone; });
present('big-int', function () { return window.BigInt; });
present('weak-ref', function () { return window.WeakRef; });
present('intl-segmenter', function () { return Intl.Segmenter; });
present('custom-elements', function () { return window.customElements; });
present('shadow-dom', function () { return document.createElement('div').attachShadow; });
present('intersection-observer', function () { return window.IntersectionObserver; });
present('resize-observer', function () { return window.ResizeObserver; });
present('performance-observer', function () { return window.PerformanceObserver; });
present('indexed-db', function () { return window.indexedDB; });
present('readable-stream', function () { return window.ReadableStream; });
present('visual-viewport', function () { return window.visualViewport; });
present('css-grid', function () { return CSS.supports('display', 'grid'); });
present('css-has', function () { return CSS.supports('selector(:has(a))'); });
present('css-container-queries', function () { return CSS.supports('container-type', 'inline-size'); });
present('css-subgrid', function () { return CSS.supports('grid-template-columns', 'subgrid'); });
present('css-clamp', function () { return CSS.supports('width', 'clamp(1px, 2px, 3px)'); });
present('css-backdrop-filter', function () { return CSS.supports('backdrop-filter', 'blur(1px)'); });
present('prefers-color-scheme', function () { return matchMedia('(prefers-color-scheme: dark)').media !== 'not all'; });

var bar = document.createElement('div');
bar.style.cssText = 'backdrop-filter:blur(10px);background:rgba(255,255,255,0.5)';
document.body.appendChild(bar);
var background = getComputedStyle(bar).backgroundColor;
report('backdrop-filter-bar-is-opaque', background.indexOf('rgba') === -1, background);
bar.remove();

(function () {
    var canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    report('webgl-context', !!gl, gl ? gl.getParameter(gl.VERSION) : 'no context');
    if (!gl)
        return;

    gl.viewport(0, 0, 64, 64);
    gl.clearColor(16 / 255, 64 / 255, 192 / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    var pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    var cleared = Math.abs(pixel[0] - 16) <= 1 && Math.abs(pixel[1] - 64) <= 1 && Math.abs(pixel[2] - 192) <= 1;
    report('webgl-clears', cleared, pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ',' + pixel[3]);

    var vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }');
    gl.compileShader(vertexShader);
    var fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, 'precision mediump float; void main(){ gl_FragColor = vec4(1.0, 0.35, 0.0, 1.0); }');
    gl.compileShader(fragmentShader);
    var program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    report('webgl-links-a-program', !!gl.getProgramParameter(program, gl.LINK_STATUS),
        gl.getProgramInfoLog(program) || '');
    gl.useProgram(program);

    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), gl.STATIC_DRAW);
    var attribute = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(attribute);
    gl.vertexAttribPointer(attribute, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(32, 16, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    var drawn = pixel[0] === 255 && Math.abs(pixel[1] - 89) <= 1 && pixel[2] === 0;
    report('webgl-draws-a-triangle', drawn, pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ',' + pixel[3]);
    report('webgl-without-errors', gl.getError() === 0, '0x' + gl.getError().toString(16));
}());

var wasmModule = new Uint8Array([0,97,115,109,1,0,0,0, 1,7,1,96,2,127,127,1,127, 3,2,1,0,
                                 7,7,1,3,97,100,100,0,0, 10,9,1,7,0,32,0,32,1,106,11]);
function finish() { reportDone(); }
try {
    WebAssembly.instantiate(wasmModule).then(function (result) {
        var sum = result.instance.exports.add(40, 2);
        report('wasm-runs-a-module', sum === 42, 'add(40,2) = ' + sum);
        finish();
    }, function (error) {
        report('wasm-runs-a-module', false, 'instantiate rejected: ' + error);
        finish();
    });
} catch (e) {
    report('wasm-runs-a-module', false, 'threw ' + e.name);
    finish();
}
</script>
