name: prebuilt

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to build once for its key
        type: choice
        options:
          - llvm
          - llvm-libraries
          - swift
          - swift-runtime
          - libcxx
          - ld64
        default: llvm

permissions:
  contents: write

concurrency:
  group: prebuilt-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      REVENANT_PREBUILT: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Name the archive folder
        run: echo "REVENANT_PREBUILT_OUT=$RUNNER_TEMP/prebuilt" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6 and show its clang
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcrun --find clang
          xcrun clang --version

      - name: Free the disk of the other Xcode versions
        run: |
          df -h /
          for app in /Applications/Xcode_*.app; do
            case "$app" in
              /Applications/Xcode_26.6.app) ;;
              *) sudo rm -rf "$app" ;;
            esac
          done
          df -h /

      - name: Build xmake from its pin
        run: ./xmakew --version

      - name: Install the linker the iOS SDK links with
        run: |
          [ -x /opt/homebrew/opt/llvm/bin/llvm-config ] || brew install llvm
          ./xmakew require -P . -y -v revenant@ld64
          ld64=$(./xmakew where -P . ld64)
          if [ -z "$ld64" ] || [ ! -x "$ld64/bin/ld" ]; then
            echo "xmake installed no ld64 at '$ld64'" >&2
            ./xmakew require -P . --info revenant@ld64
            exit 1
          fi

      - name: Prove the iOS SDK links with ld64
        run: |
          ld="$(./xmakew where -P . ld64)/bin/ld"
          [ -x "$ld" ] || { echo "no ld64 at $ld" >&2; exit 1; }
          probe="$RUNNER_TEMP/linker-probe"
          mkdir -p "$probe"
          printf 'int f(void) { return 1; }\n' > "$probe/a.c"
          xcrun clang -c -target armv6-apple-ios -miphoneos-version-min=2.0 "$probe/a.c" -o "$probe/a.o"
          rc=0
          xcrun clang -r -target armv6-apple-ios -miphoneos-version-min=2.0 -nostdlib --ld-path="$ld" -v "$probe/a.o" -o "$probe/a-link.o" > "$probe/link.log" 2>&1 || rc=$?
          grep -E '^ *"[^"]*/ld"' "$probe/link.log" | cut -c1-240
          if ! grep -qF "\"$ld\"" "$probe/link.log"; then cat "$probe/link.log"; echo "the link did not invoke $ld" >&2; exit 1; fi
          if [ "$rc" -ne 0 ]; then cat "$probe/link.log"; fi
          exit "$rc"

      - name: Build or fetch the package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            llvm) ./xmakew require -P . -y -v --extra="{system=false}" revenant@llvm ;;
            llvm-libraries) ./xmakew require -P . -y -v --extra="{system=false,configs={libraries=true}}" revenant@llvm ;;
            swift) ./xmakew require -P . -y -v --extra="{system=false}" revenant@swift ;;
            swift-runtime) ./xmakew require -P . -y -v --extra="{system=false}" revenant@swift-runtime ;;
            libcxx) ./xmakew require -P . -y -v --extra="{system=false}" revenant@libcxx ;;
            ld64) ./xmakew require -P . -y -v --extra="{system=false}" revenant@ld64 ;;
            *) echo "no such package: $PACKAGE" >&2; exit 1 ;;
          esac

      - name: Attach the archive to the release of its key
        env:
          COMMIT: ${{ github.sha }}
        run: |
          shopt -s nullglob
          tagfiles=("$REVENANT_PREBUILT_OUT"/*.tag)
          if [ ${#tagfiles[@]} -eq 0 ]; then
            echo "the build archived no package, so there is nothing to release" >&2
            exit 1
          fi
          for tagfile in "${tagfiles[@]}"; do
            tag=$(cat "$tagfile")
            name=$(basename "$tagfile" .tag)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is released already"
              continue
            fi
            gh release create "$tag" "$REVENANT_PREBUILT_OUT/$name"-*.tar.xz "$REVENANT_PREBUILT_OUT/$name"-*.tar.xz.sha256 \
              --title "$tag" --notes "Built by the prebuilt workflow from $COMMIT on $RUNNER_OS $RUNNER_ARCH." --prerelease
          done

      - name: Measure the disk
        if: always()
        run: |
          df -h /
          du -sh "$RUNNER_TEMP" 2>/dev/null || true
