name: check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      REVENANT_PREBUILT: kern0x1b/revenant
      REVENANT_PREBUILT_ONLY: "llvm,swift,ld64"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6 and show its clang
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcrun --find clang
          xcrun clang --version

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-checks-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**', 'packages/**', 'toolchain/modules/prebuilt.lua', 'emulator/xmake.lua', 'recompiler/xmake.lua', 'toolchain/tests/xmake.lua') }}

      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.revenant/cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install the packages
        id: configure
        timeout-minutes: 30
        run: ./xmakew f -P . -y --emulator_vulkan=n

      - name: Run the tests
        id: tests
        run: ./xmakew test -P . --output-on-failure

      - name: Save the package store
        if: always() && steps.configure.outcome == 'success' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-checks-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**', 'packages/**', 'toolchain/modules/prebuilt.lua', 'emulator/xmake.lua', 'recompiler/xmake.lua', 'toolchain/tests/xmake.lua') }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.revenant/cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

  backports:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REVENANT_PREBUILT: kern0x1b/revenant
      REVENANT_PREBUILT_ONLY: "llvm,swift,ld64"
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - name: Select Xcode 26.6 and show its clang
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcrun --find clang
          xcrun clang --version

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/restore@v4
        id: generated
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/tools/ast.lua', 'frameworks/Backports/tools/facts.lua', 'frameworks/Backports/tools/generate.lua', 'frameworks/Backports/tools/skeleton.lua', 'frameworks/Backports/tools/sdk.lua') }}
          restore-keys: |
            backports-generated-${{ runner.os }}-

      - name: Check that the branch has the Backports component
        id: component
        run: |
          if git grep -q 'option("component"' -- '*xmake.lua'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=backports::this branch has no component option; the Backports build is skipped"
            echo "Backports build skipped: this branch has no component option." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/cache/restore@v4
        id: objects
        if: steps.component.outputs.present == 'true'
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
          key: backports-objects-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/**', 'toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew') }}

      - name: Configure the Backports component
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 20
        run: |
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          echo "stage configure starts $(date -u +%H:%M:%S)"
          ./xmakew f -P . -p iphoneos -a armv7 --component=Backports -y -v 2>&1 | stamp
          echo "stage configure ends $(date -u +%H:%M:%S)"

      - name: Extract the facts of every framework
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 10
        run: |
          echo "stage facts starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/generate.lua
          echo "stage facts ends $(date -u +%H:%M:%S)"

      - name: Show the package logs when the configure failed
        if: failure() && steps.component.outputs.present == 'true'
        run: |
          find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -20
          for f in $(find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -10); do
            echo "== $f"
            tail -30 "$f"
          done

      - name: Save the package store
        if: steps.component.outputs.present == 'true' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - name: Save the generated skeleton
        if: steps.component.outputs.present == 'true' && steps.generated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/tools/ast.lua', 'frameworks/Backports/tools/facts.lua', 'frameworks/Backports/tools/generate.lua', 'frameworks/Backports/tools/skeleton.lua', 'frameworks/Backports/tools/sdk.lua') }}

      - name: Build the Backports component
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 12
        run: |
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          echo "stage build starts $(date -u +%H:%M:%S)"
          ./xmakew build -P . 2>&1 | stamp
          echo "stage build ends $(date -u +%H:%M:%S)"

      - uses: actions/cache/save@v4
        if: steps.component.outputs.present == 'true' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
          key: backports-objects-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/**', 'toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew') }}

      - name: Upload the Backports libraries
        if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backports-libraries
          path: build/iphoneos/armv7/release/lib*.dylib
          if-no-files-found: error

      - name: Run the Backports tests
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 10
        run: ./xmakew test -P . "backports_uikit/*" --output-on-failure

      - name: Check the exports and count the implemented members
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          status=0
          echo "stage exports starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/exports.lua > "$RUNNER_TEMP/report/run.txt" 2>&1 || status=$?
          echo "stage exports ends $(date -u +%H:%M:%S)"
          cat "$RUNNER_TEMP/report/run.txt"
          cat "$RUNNER_TEMP/report/run.txt" >> "$GITHUB_STEP_SUMMARY"
          cp build/generated/backports/exports.txt build/generated/backports/status.txt "$RUNNER_TEMP/report/"
          echo "Top 10 frameworks by implemented members:" >> "$GITHUB_STEP_SUMMARY"
          grep -v '^total' build/generated/backports/status.txt | sort -k3,3nr | head -10 >> "$GITHUB_STEP_SUMMARY"
          grep '^total' build/generated/backports/status.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && steps.component.outputs.present == 'true'
        with:
          name: backports-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

  swift:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      REVENANT_PREBUILT: kern0x1b/revenant
      REVENANT_PREBUILT_ONLY: "llvm,swift,ld64,swift-runtime,libcxx"
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - name: Select Xcode 26.6 and show its clang
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcrun --find clang
          xcrun clang --version

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 swift-runtime libcxx | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - name: Install the firmware tools through the Backports configuration
        timeout-minutes: 20
        run: ./xmakew f -P . -p iphoneos -a armv7 --component=Backports -y -v 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - uses: actions/cache/restore@v4
        id: dyld
        with:
          path: ~/.revenant/dyld/6.0
          key: dyld-shared-cache-6.0-armv7-v1

      - name: Fetch the iOS 6.0 armv7 shared cache
        if: steps.dyld.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: ./xmakew firmware -P . -y --arch=armv7 fetch 6.0

      - uses: actions/cache/save@v4
        if: steps.dyld.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/dyld/6.0
          key: dyld-shared-cache-6.0-armv7-v1

      - name: Configure the Swift component
        timeout-minutes: 20
        run: ./xmakew f -P . -p iphoneos -a armv7 --component=Swift -y -v 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Build the Swift targets
        timeout-minutes: 20
        run: ./xmakew build -P . AppIntents ActivityKit TipKit swiftSpatial swiftCloudKit swiftWeatherKit 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Install the Swift packages through their wrappers
        timeout-minutes: 20
        run: ./xmakew require -P . -y revenant@appintents revenant@activitykit revenant@tipkit revenant@swiftui revenant@spatial revenant@cloudkit revenant@weatherkit 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Save the package store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}
