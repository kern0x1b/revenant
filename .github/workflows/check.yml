name: check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'third_party/xmake/**') }}

      - name: Check the comments
        run: ./xmakew l -P . tools/comments.lua check

      - name: Count the layout breaks
        run: |
          out="$RUNNER_TEMP/layout.txt"
          ./xmakew l -P . tools/check.lua layout > "$out" 2>&1 || true
          count=$(grep -oE '[0-9]+ paths break' "$out" | grep -oE '[0-9]+' || true)
          echo "::warning title=layout::${count:-no count printed} paths break the layout; not failing yet"
          echo "Layout breaks: ${count:-no count printed} (reported, not failing yet)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the toolchain
        env:
          LIGHT_SKIP: doc_test
        run: |
          echo "::notice title=doc_test::skipped: it tests the old generator, which is deleted with the registry"
          ./xmakew l -P . tools/check.lua toolchain

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'third_party/xmake/**') }}

  backports:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REVENANT_PREBUILT: kern0x1b/revenant
      REVENANT_PREBUILT_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - name: Select the newest Xcode and show its clang
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcode-select -p
          xcrun clang --version

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'third_party/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/restore@v4
        id: generated
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ hashFiles('frameworks/Backports/**') }}
          restore-keys: |
            backports-generated-${{ runner.os }}-

      - name: Check that the branch has the Backports component
        id: component
        run: |
          if git grep -q 'option("component"' -- '*xmake.lua'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=backports::this branch has no component option; the Backports build is skipped"
            echo "Backports build skipped: this branch has no component option." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/cache/restore@v4
        id: objects
        if: steps.component.outputs.present == 'true'
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
          key: backports-objects-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/**', 'toolchain/**', 'packages/**', 'addons/**', 'third_party/**', 'xmake.lua', 'xmakew') }}

      - name: Configure the Backports component
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 20
        run: |
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          echo "stage configure starts $(date -u +%H:%M:%S)"
          ./xmakew f -P . -p iphoneos -a armv7 --component=Backports -y -v 2>&1 | stamp
          echo "stage configure ends $(date -u +%H:%M:%S)"

      - name: Show the package logs when the configure failed
        if: failure() && steps.component.outputs.present == 'true'
        run: |
          find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -20
          for f in $(find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -10); do
            echo "== $f"
            tail -30 "$f"
          done

      - name: Save the package store
        if: steps.component.outputs.present == 'true' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - name: Save the generated skeleton
        if: steps.component.outputs.present == 'true' && steps.generated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ hashFiles('frameworks/Backports/**') }}

      - name: Build the Backports component
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 30
        run: |
          echo "stage build starts $(date -u +%H:%M:%S)"
          failed=""
          for name in $(grep -oE 'name = "[A-Za-z0-9]+Backports"' frameworks/Backports/xmake.lua | sed -E 's/.*"([^"]+)"/\1/'); do
            if ! ./xmakew build -P . "$name" > "$RUNNER_TEMP/$name.txt" 2>&1; then
              failed="$failed $name"
              sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/$name.txt" | grep -E -A4 "Undefined symbols|malformed|not found for|error: " | head -20
            fi
          done
          echo "failed targets:$failed"
          echo "stage build ends $(date -u +%H:%M:%S)"
          test -z "$failed"

      - uses: actions/cache/save@v4
        if: steps.component.outputs.present == 'true' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
          key: backports-objects-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/**', 'toolchain/**', 'packages/**', 'addons/**', 'third_party/**', 'xmake.lua', 'xmakew') }}

      - name: Upload the Backports libraries
        if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backports-libraries
          path: build/iphoneos/armv7/release/lib*.dylib
          if-no-files-found: error

      - name: Check every source key against the built libraries
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          echo "stage exports starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/exports.lua > "$RUNNER_TEMP/report/exports.txt" 2>&1
          echo "stage exports ends $(date -u +%H:%M:%S)"
          cat "$RUNNER_TEMP/report/exports.txt" | head -40
          cat "$RUNNER_TEMP/report/exports.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Count the implemented members per framework
        if: steps.component.outputs.present == 'true'
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          echo "stage status starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/status.lua > "$RUNNER_TEMP/report/status.txt" 2>&1
          echo "stage status ends $(date -u +%H:%M:%S)"
          echo "Top 10 frameworks by implemented members:" >> "$GITHUB_STEP_SUMMARY"
          grep -v '^total' "$RUNNER_TEMP/report/status.txt" | sort -k3,3nr | head -10 >> "$GITHUB_STEP_SUMMARY"
          grep '^total' "$RUNNER_TEMP/report/status.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: steps.component.outputs.present == 'true'
        with:
          name: backports-report
          path: ${{ runner.temp }}/report
          if-no-files-found: error

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'third_party/xmake/**') }}
