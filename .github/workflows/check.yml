name: check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/revenant-setup

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-checks-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**', 'packages/**', 'toolchain/modules/prebuilt.lua', 'emulator/xmake.lua', 'recompiler/xmake.lua', 'toolchain/tests/xmake.lua') }}

      - name: Install the packages
        id: configure
        timeout-minutes: 30
        run: ./xmakew f -P . -y --emulator_vulkan=n

      - name: Run the tests
        id: tests
        run: ./xmakew test -P . --output-on-failure

      - name: Save the package store
        if: always() && steps.configure.outcome == 'success' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-checks-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**', 'packages/**', 'toolchain/modules/prebuilt.lua', 'emulator/xmake.lua', 'recompiler/xmake.lua', 'toolchain/tests/xmake.lua') }}

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

  backports:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - uses: ./.github/actions/revenant-setup

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/restore@v4
        id: generated
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/tools/ast.lua', 'frameworks/Backports/tools/facts.lua', 'frameworks/Backports/tools/generate.lua', 'frameworks/Backports/tools/skeleton.lua', 'frameworks/Backports/tools/sdk.lua') }}
          restore-keys: |
            backports-generated-${{ runner.os }}-

      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
            build/backports-sources.txt
          key: backports-objects-v2-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew', 'frameworks/Backports/xmake.lua') }}-${{ hashFiles('frameworks/Backports/**') }}
          restore-keys: |
            backports-objects-v2-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew', 'frameworks/Backports/xmake.lua') }}-

      - name: Configure the Backports component
        timeout-minutes: 45
        run: |
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          echo "stage configure starts $(date -u +%H:%M:%S)"
          ./xmakew f -P . -p iphoneos -a armv7 --component=Backports -y -v 2>&1 | stamp
          echo "stage configure ends $(date -u +%H:%M:%S)"

      - name: Extract the facts of every framework
        timeout-minutes: 10
        run: |
          echo "stage facts starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/generate.lua
          echo "stage facts ends $(date -u +%H:%M:%S)"

      - name: Touch the Backports sources that changed since the cached objects were built
        run: |
          manifest=build/backports-sources.txt
          if [ ! -f "$manifest" ]; then
            echo "The cache has no source manifest, so every object is built"
            exit 0
          fi
          sources() {
            { git ls-files -- frameworks/Backports; find build/generated/backports/skeleton -type f 2>/dev/null || true; } | LC_ALL=C sort > "$RUNNER_TEMP/backports-names.txt"
            xargs git hash-object < "$RUNNER_TEMP/backports-names.txt" | paste - "$RUNNER_TEMP/backports-names.txt" | LC_ALL=C sort
          }
          sources > "$RUNNER_TEMP/backports-sources.txt"
          LC_ALL=C comm -13 "$manifest" "$RUNNER_TEMP/backports-sources.txt" | cut -f2 | while IFS= read -r path; do
            echo "changed since the cache: $path"
            touch "$path"
          done

      - name: Show the package logs when the configure failed
        if: failure()
        run: |
          find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -20
          for f in $(find "$HOME/.revenant/cache/xmake-global" -path '*logs*' -type f 2>/dev/null | head -10); do
            echo "== $f"
            tail -30 "$f"
          done

      - name: Save the package store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - name: Save the generated skeleton
        if: steps.generated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/generated/backports
          key: backports-generated-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/tools/ast.lua', 'frameworks/Backports/tools/facts.lua', 'frameworks/Backports/tools/generate.lua', 'frameworks/Backports/tools/skeleton.lua', 'frameworks/Backports/tools/sdk.lua') }}

      - name: Build the Backports component
        timeout-minutes: 60
        run: |
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          echo "stage build starts $(date -u +%H:%M:%S)"
          ./xmakew build -P . 2>&1 | stamp
          echo "stage build ends $(date -u +%H:%M:%S)"

      - name: Record the Backports sources the objects are built from
        run: |
          sources() {
            { git ls-files -- frameworks/Backports; find build/generated/backports/skeleton -type f 2>/dev/null || true; } | LC_ALL=C sort > "$RUNNER_TEMP/backports-names.txt"
            xargs git hash-object < "$RUNNER_TEMP/backports-names.txt" | paste - "$RUNNER_TEMP/backports-names.txt" | LC_ALL=C sort
          }
          sources > build/backports-sources.txt

      - uses: actions/cache/save@v4
        if: steps.objects.outputs.cache-hit != 'true'
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
            build/backports-sources.txt
          key: backports-objects-v2-${{ runner.os }}-${{ steps.keys.outputs.hash }}-${{ hashFiles('toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew', 'frameworks/Backports/xmake.lua') }}-${{ hashFiles('frameworks/Backports/**') }}

      - name: Upload the Backports libraries
        uses: actions/upload-artifact@v4
        with:
          name: backports-libraries
          path: build/iphoneos/armv7/release/lib*.dylib
          if-no-files-found: error

      - name: Run the Backports tests
        timeout-minutes: 10
        run: ./xmakew test -P . "backports_uikit/*" --output-on-failure
      - name: Link the probe app against the Backports libraries
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          ./xmakew build -P . BackportsProbe
          ./xmakew l -P . frameworks/Backports/tools/probe.lua build/iphoneos/armv7/release/BackportsProbe 2>&1 | tee "$RUNNER_TEMP/report/probe.txt"
          cat "$RUNNER_TEMP/report/probe.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the exports and count the implemented members
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          status=0
          echo "stage exports starts $(date -u +%H:%M:%S)"
          ./xmakew l -P . frameworks/Backports/tools/exports.lua > "$RUNNER_TEMP/report/run.txt" 2>&1 || status=$?
          echo "stage exports ends $(date -u +%H:%M:%S)"
          cat "$RUNNER_TEMP/report/run.txt"
          cat "$RUNNER_TEMP/report/run.txt" >> "$GITHUB_STEP_SUMMARY"
          cp build/generated/backports/exports.txt build/generated/backports/status.txt "$RUNNER_TEMP/report/"
          echo "Top 10 frameworks by implemented members:" >> "$GITHUB_STEP_SUMMARY"
          grep -v '^total' build/generated/backports/status.txt | sort -k3,3nr | head -10 >> "$GITHUB_STEP_SUMMARY"
          grep '^total' build/generated/backports/status.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backports-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

  package:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - uses: ./.github/actions/revenant-setup
        with:
          prebuilt-only: "llvm,swift,ld64,swift-runtime,libcxx"

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 swift-runtime libcxx | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Key the Backports objects as the backports job keys them
        id: objects_keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-package-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: |
            build/.objs
            build/.deps
            build/iphoneos
          key: backports-objects-${{ runner.os }}-${{ steps.objects_keys.outputs.hash }}-${{ hashFiles('frameworks/Backports/**', 'toolchain/**', 'packages/**', 'addons/**', 'xmake.lua', 'xmakew') }}

      - uses: actions/cache/restore@v4
        id: dyld
        with:
          path: ~/.revenant/dyld/6.0
          key: dyld-shared-cache-6.0-armv7-v1

      - name: Fetch the iOS 6.0 armv7 shared cache
        if: steps.dyld.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: ./xmakew firmware -P . -y --arch=armv7 fetch 6.0

      - name: Configure the SwiftUI demo's component
        timeout-minutes: 45
        run: ./xmakew f -P . -p iphoneos -a armv7 --component=SwiftUIDemo -y -v 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Build the demo and package it with its platform package
        timeout-minutes: 60
        run: ./xmakew deb -P . SwiftUIDemo 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Check the demo's Depends and the platform package's file list
        run: ./xmakew l -P . toolchain/tools/deb_check.lua build space.kern0x1b.swiftui org.revenant.backports

      - uses: actions/upload-artifact@v4
        with:
          name: swiftui-packages
          path: build/*.deb
          if-no-files-found: error

      - name: Save the package store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-package-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

  swift:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Give the checkout a fixed mtime
        run: git ls-files -z | xargs -0 touch -t 200001010000

      - uses: ./.github/actions/revenant-setup
        with:
          prebuilt-only: "llvm,swift,ld64,swift-runtime,libcxx"

      - uses: actions/cache/restore@v4
        id: xmake
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}

      - name: Key the package store
        id: keys
        run: echo "hash=$(./xmakew l -P . tools/keys.lua iphoneos-sdk ld64 swift-runtime libcxx | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - name: Install the firmware tools through the Backports configuration
        timeout-minutes: 45
        run: ./xmakew f -P . -p iphoneos -a armv7 --component=Backports -y -v 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - uses: actions/cache/restore@v4
        id: dyld
        with:
          path: ~/.revenant/dyld/6.0
          key: dyld-shared-cache-6.0-armv7-v1

      - name: Fetch the iOS 6.0 armv7 shared cache
        if: steps.dyld.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: ./xmakew firmware -P . -y --arch=armv7 fetch 6.0

      - uses: actions/cache/save@v4
        if: steps.dyld.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/dyld/6.0
          key: dyld-shared-cache-6.0-armv7-v1

      - name: Configure the Swift component
        timeout-minutes: 20
        run: ./xmakew f -P . -p iphoneos -a armv7 --component=Swift -y -v 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Build the Swift targets
        timeout-minutes: 20
        run: ./xmakew build -P . AppIntents ActivityKit TipKit WidgetKit swiftSpatial swiftCloudKit swiftWeatherKit swiftNetwork swiftUniformTypeIdentifiers swiftCryptoKit 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Install the Swift packages through their wrappers
        timeout-minutes: 20
        run: ./xmakew require -P . -y revenant@appintents revenant@activitykit revenant@tipkit revenant@widgetkit revenant@swiftui revenant@spatial revenant@cloudkit revenant@weatherkit revenant@uniformtypeidentifiers revenant@cryptokit 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done

      - name: Save the package store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.revenant/cache/xmake-global
          key: xmake-global-${{ runner.os }}-${{ steps.keys.outputs.hash }}

      - uses: actions/cache/save@v4
        if: always() && steps.xmake.outputs.cache-hit != 'true'
        with:
          path: ~/.revenant/cache/xmake
          key: xmake-bin-${{ runner.os }}-${{ hashFiles('xmakew', 'packages/x/xmake/**') }}
