name: webkit-reference

on:
  push:
    branches: [work/webkit-reference]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: macos-26
    timeout-minutes: 330
    env:
      XMAKE_MAX_JOBS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode and the prebuilt variables
        uses: ./.github/actions/revenant-setup
        with:
          prebuilt-only: llvm,ld64

      - name: Run icutools.databuilder through ICU 78.3's configure, with the recipe's source and options
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/icu"
          out="$RUNNER_TEMP/icu-out"
          mkdir -p "$work/build" "$out"
          curl -fsSL -o "$work/icu.tgz" https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz
          echo "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0  $work/icu.tgz" | shasum -a 256 -c -
          tar -xzf "$work/icu.tgz" -C "$work"
          configure=$(find "$work" -path '*/source/configure' -maxdepth 4 -print -quit)
          test -n "$configure" || { echo "ICU source: no configure under $work"; exit 1; }
          echo "interpreter: $(command -v python3) $(python3 -c 'import sys; print(sys.version.split()[0])')" | tee "$out/icu-run.txt"
          cd "$work/build"
          sh "$configure" --enable-static --disable-shared --disable-tests --disable-samples --disable-extras 2>&1 | tee "$out/configure.log"
          cp data/rules.mk "$out/data-rules.mk"
          cp test/testdata/rules.mk "$out/test-testdata-rules.mk"
          grep -n 'icutools.databuilder' "$configure" "$(dirname "$configure")/configure.ac" > "$out/databuilder-invocations.txt" || true
          test -s "$out/test-testdata-rules.mk"

      - name: Configure the WebKit engine without building it, with a Python shim on PATH
        shell: bash
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/shim"
          mkdir -p "$shim"
          : > "$shim/calls.log"
          for name in python python3; do
            cat > "$shim/$name" <<EOF
          #!/bin/sh
          echo "PYTHON RAN: \$0 \$*" >> "$shim/calls.log"
          exit 97
          EOF
            chmod +x "$shim/$name"
          done
          export PATH="$shim:$PATH"
          export REVENANT_REPO="$GITHUB_WORKSPACE"
          export REVENANT_WEBKIT_PYTHON="$shim/python3"
          export REVENANT_ENGINE_CONFIGURE_ONLY=1
          export REVENANT_ICU_NO_TRIM=1
          export REVENANT_REFERENCE_NO_LTO=1
          ./xmakew f -y -P tools/webkit-reference -p iphoneos -a armv7
          test ! -s "$shim/calls.log"

      - name: Run the interpreter-driven generators and write the bundle
        shell: bash
        run: |
          set -euo pipefail
          build=$(find "$HOME/.revenant/cache/xmake-global" -path '*/webkit-engine/latest/build/build.ninja' -print -quit)
          test -n "$build" || { echo "no build.ninja of webkit-engine in the store"; exit 1; }
          echo "build: $build"
          py=$(command -v python3)
          pyver=$("$py" -c 'import sys; print(sys.version.split()[0])')
          commit=$(sed -n 's/^ *local commit = "\([0-9a-f]*\)".*/\1/p' packages/w/webkit/xmake.lua | cut -c1-7)
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          ./xmakew l -P . tools/webkit-reference/reference.lua run "$(dirname "$build")" "$py" "$RUNNER_TEMP/shim/python3" "$RUNNER_TEMP/icu-out" "$stage" "$pyver" "$RUNNER_TEMP/shim/calls.log"
          tar -czf "$RUNNER_TEMP/webkit-generator-reference-$commit.tar.gz" -C "$stage" .
          tar -tzf "$RUNNER_TEMP/webkit-generator-reference-$commit.tar.gz" | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: webkit-generator-reference
          path: ${{ runner.temp }}/webkit-generator-reference-*.tar.gz
          retention-days: 7

      - name: Publish the reference release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^ *local commit = "\([0-9a-f]*\)".*/\1/p' packages/w/webkit/xmake.lua | cut -c1-7)
          tag="webkit-generator-reference-$commit"
          archive="$RUNNER_TEMP/$tag.tar.gz"
          gh release create "$tag" "$archive" --target "$GITHUB_SHA" --title "$tag" --notes "WebKit generator outputs for the port's configure, with the ICU 78.3 databuilder rules, produced by the reference workflow on CI. The one sanctioned Python run; the reference the Lua port must match byte for byte. manifest.json lists every generator edge with its command and input and output digests."
